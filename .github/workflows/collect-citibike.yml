name: Collect Citi Bike availability

# Citi Bike does not keep a history of station availability, so Tandem records
# it. Each run takes a snapshot every 5 minutes for ~55 minutes, commits the
# CSVs to the tandem-data repository, then starts the next run.
#
# To stop collecting: Actions tab -> this workflow -> "..." -> Disable workflow.
# To restart: enable it, then "Run workflow" (or wait for the hourly schedule).
#
# Setup (already done for alexxu2027/tandem; repeat if this repo moves):
#   1. Create the data repo, e.g. alexxu2027/tandem-data.
#   2. ssh-keygen -t ed25519 -N "" -f deploy_key
#   3. Add deploy_key.pub to the data repo as a deploy key WITH write access.
#   4. Add the private key to this repo as the secret TANDEM_DATA_DEPLOY_KEY.
#   5. If the data repo name differs, set the repository variable TANDEM_DATA_REPO.

on:
  # Backup only. Each run starts the next one (last step below), because
  # GitHub's scheduler can skip or delay runs for hours. If that chain ever
  # breaks, this restarts it. Off the top of the hour, when the scheduler is busiest.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to collect for"
        default: "55"

# One run at a time: a new run waits for the current one instead of
# overlapping it, so snapshots stay on the 5-minute grid without duplicates.
# GitHub keeps at most one waiting run per group, so the schedule and the chain
# can never pile up into parallel chains.
concurrency:
  group: collect-citibike
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # to start the next run

env:
  TZ: UTC
  DATA_REPO: ${{ vars.TANDEM_DATA_REPO || 'alexxu2027/tandem-data' }}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Note the start time
        run: echo "STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      # Only today's station file is needed (it gets merged); status files are
      # new each run, so the rest of the history is never downloaded.
      - name: Check out the data repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DATA_REPO }}
          ssh-key: ${{ secrets.TANDEM_DATA_DEPLOY_KEY }}
          path: tandem-data
          fetch-depth: 1
          sparse-checkout: citibike/stations

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect snapshots
        run: >-
          python -m pipelines.citibike.gbfs collect
          --every 5
          --minutes ${{ inputs.minutes || '55' }}
          --changes-only
          --no-raw
          --out tandem-data

      # Runs even if collection failed part-way, so nothing collected is lost.
      - name: Commit to the data repository
        if: always()
        working-directory: tandem-data
        run: |
          git add --sparse citibike
          if git diff --cached --quiet; then
            echo "Nothing collected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "data(citibike): $(date -u +%Y-%m-%dT%H:%MZ) snapshots"
          git pull -q --rebase
          git push -q

      # Not on cancel: cancelling a run by hand stops the chain. A run that failed
      # fast (e.g. Citi Bike down) waits first, so retries come every 10 minutes
      # rather than in a tight loop.
      - name: Start the next run
        if: success() || failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remaining=$(( STARTED_AT + 600 - $(date +%s) ))
          if [ "$remaining" -gt 0 ]; then sleep "$remaining"; fi
          gh workflow run collect-citibike.yml --repo "$GITHUB_REPOSITORY" --ref main
