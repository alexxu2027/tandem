name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tandem runs on UTC everywhere, including CI.
  TZ: UTC

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint pipelines and ml
        working-directory: .
        run: |
          uv run --project backend ruff check pipelines ml
          uv run --project backend ruff format --check pipelines ml

      - name: Run tests
        run: uv run pytest -v

  migrations:
    name: Migrations (PostGIS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # Must match the image in docker-compose.yml: migrations and
        # `alembic check` need to run against the same PostGIS minor that
        # developers use locally, or spatial DDL can pass here and fail there.
        image: imresamu/postgis:16-3.6-bookworm
        env:
          POSTGRES_USER: tandem
          POSTGRES_PASSWORD: tandem
          POSTGRES_DB: tandem
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tandem -d tandem"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://tandem:tandem@localhost:5432/tandem
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Enable PostGIS extension
        run: |
          PGPASSWORD=tandem psql -h localhost -U tandem -d tandem \
            -v ON_ERROR_STOP=1 -f ../scripts/init_postgis.sql

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Verify migrations are in sync with the models
        run: uv run alembic check

  frontend:
    name: Frontend (lint + types + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: TypeScript type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build
