# Local development infrastructure for Tandem.
#
#   docker compose up -d db          # just Postgres/PostGIS (recommended)
#   docker compose --profile app up  # Postgres + backend + frontend
#
# Values come from the root `.env` (copy it from `.env.example` first).

name: tandem

services:
  db:
    # Multi-architecture image (linux/amd64 + linux/arm64). Deliberately no
    # `platform:` directive: Docker resolves the right variant per host, so
    # amd64 and arm64 developers share one compose file.
    image: imresamu/postgis:16-3.6-bookworm
    container_name: tandem-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tandem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tandem}
      POSTGRES_DB: ${POSTGRES_DB:-tandem}
      # Keeps container logs and timestamps in UTC, matching the application.
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs once, on first initialization of an empty data volume.
      - ./scripts/init_postgis.sql:/docker-entrypoint-initdb.d/00-init-postgis.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tandem} -d ${POSTGRES_DB:-tandem}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    profiles: ["app"]
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: tandem-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Inside the Compose network the database is reachable as `db`,
      # overriding whatever the host-oriented .env says.
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      TZ: UTC
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # Bind-mount the source for hot reload, but keep the image's virtualenv.
      - ./backend:/app
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    profiles: ["app"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: tandem-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NODE_ENV: development
      TZ: UTC
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: pnpm dev

volumes:
  postgres_data:
    name: tandem_postgres_data
